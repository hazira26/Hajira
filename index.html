<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>হাজিরা অ্যাপ – রশিদিয়া নূরানী মাদ্রাসা</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f8f5;--card:#fff;--tx:#1b2a22;--mu:#5d6f65;--pr:#0f6b45;--bd:#d7e4dc;--ab:#c0392b;--abbg:#fdecea;--pbg:#e6f5ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a15;--card:#18251e;--tx:#e6f0ea;--mu:#9bb0a4;--pr:#3fbf86;--bd:#2a3d33;--ab:#ff7b6b;--abbg:#3a1f1c;--pbg:#183427}}
:root[data-theme="dark"]{--bg:#101a15;--card:#18251e;--tx:#e6f0ea;--mu:#9bb0a4;--pr:#3fbf86;--bd:#2a3d33;--ab:#ff7b6b;--abbg:#3a1f1c;--pbg:#183427}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali","Kalpurush","SolaimanLipi",system-ui,sans-serif;line-height:1.5}
header{background:var(--pr);color:#fff;text-align:center;padding:14px 12px}
header h1{margin:0;font-size:1.15rem}header p{margin:2px 0 0;font-size:.85rem;opacity:.92}
nav{display:flex;gap:6px;padding:10px;max-width:760px;margin:auto}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{max-width:760px;margin:auto;padding:0 10px 30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:.85rem;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--pr);color:#fff;font:inherit;font-weight:600;text-decoration:none;display:inline-block;text-align:center}
.btn.wa{background:#1fa855}.btn.gr{background:var(--bd);color:var(--tx)}.btn.sm{padding:6px 10px;font-size:.85rem}
.st{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card)}
.st.P{background:var(--pbg)}.st.A{background:var(--abbg)}
.info{flex:1 1 140px}.info b{display:block}.info small{color:var(--mu)}
.sum{display:flex;gap:8px;text-align:center;margin-bottom:10px}.sum div{flex:1;padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--bd)}
.sum b{font-size:1.3rem;display:block}
.empty{text-align:center;color:var(--mu);padding:20px}
.note{font-size:.8rem;color:var(--mu)}
@media print{nav,.btn,header p{display:none}}
</style>
</head>
<body>
<header style="position:relative"><button onclick="tab='set';render()" title="সেটিং" style="position:absolute;right:8px;top:6px;background:none;border:0;color:#fff;font-size:1.2rem;opacity:.6">⚙</button>
<h1>হিফজুল কুরআন রশিদিয়া হোসাইনিয়া নূরানী মাদ্রাসা</h1>
<p>কালুশাহ সড়ক, সৈয়দ রশিদিয়া মঞ্জিল, বরিশাল</p>
<p>মোবাইল: ০১৭১১৩৪০২০৫</p>
</header>
<nav id="nav"></nav>
<div id="gh_st" class="note" style="text-align:center"></div>
<main id="app"></main>
<script>
var CLASSES=["প্লে","নার্সারি","প্রথম শ্রেণী","দ্বিতীয় শ্রেণী","তৃতীয় শ্রেণি"];
var MADRASA="হিফজুল কুরআন রশিদিয়া হোসাইনিয়া নূরানী মাদ্রাসা";
var PHONE="০১৭১১৩৪০২০৫";
var DB={students:[],att:{}};
try{var s=localStorage.getItem("hajira_v1");if(s)DB=JSON.parse(s)}catch(e){}
var tab="att",selCls=CLASSES[0],selDate=today(),editId=null;
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function bn(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})}
function en(s){return String(s).replace(/[০-৯]/g,function(d){return "০১২৩৪৫৬৭৮৯".indexOf(d)})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nowT(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function t12(t){if(!t)return"";var p=t.split(":"),h=+p[0],a=h>=12?"অপরাহ্ন":"পূর্বাহ্ন";h=h%12||12;return bn(h)+":"+bn(p[1])+" "+a}
function dateBn(d){var p=d.split("-");return bn(p[2]+"/"+p[1]+"/"+p[0])}
function waNum(m){var n=en(m).replace(/\D/g,"");if(n.indexOf("880")===0)return n;if(n.charAt(0)==="0")return "88"+n;return "880"+n}
function waLink(st,date){
 var msg="আসসালামু আলাইকুম। আপনার সন্তান "+st.name+" (আইডি: "+st.sid+", "+st.cls+") আজ "+dateBn(date)+" তারিখে মাদ্রাসায় অনুপস্থিত ছিল। অনুগ্রহ করে কারণ জানাবেন।\n— "+MADRASA+", "+PHONE;
 return "https://wa.me/"+waNum(st.mobile)+"?text="+encodeURIComponent(msg)}
function rec(){return(DB.att[selDate+"|"+selCls]=DB.att[selDate+"|"+selCls]||{})}
function mark(id,v){var r=rec();if(r[id]&&r[id].s===v){delete r[id]}else{r[id]={s:v,t:nowT()}}save();render()}
function setT(id,v){rec()[id].t=v;save()}
function nav(){
 var t=[["att","হাজিরা"],["stu","ছাত্র-ছাত্রী"],["rep","রিপোর্ট"]];
 document.getElementById("nav").innerHTML=t.map(function(x){return '<button class="'+(tab===x[0]?"on":"")+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join("")}
function clsSel(v,fn){return '<select onchange="'+fn+'">'+CLASSES.map(function(c){return '<option'+(c===v?" selected":"")+'>'+c+'</option>'}).join("")+'</select>'}
function viewAtt(){
 var list=DB.students.filter(function(s){return s.cls===selCls}),r=rec();
 var p=0,a=0;list.forEach(function(s){if(r[s.id]){r[s.id].s==="P"?p++:a++}});
 var h='<div class="card"><div class="row"><div><label>শ্রেণী</label>'+clsSel(selCls,"selCls=this.value;render()")+'</div><div><label>তারিখ</label><input type="date" value="'+selDate+'" onchange="selDate=this.value||today();render()"></div></div></div>';
 h+='<div class="sum"><div>মোট<b>'+bn(list.length)+'</b></div><div>উপস্থিত<b style="color:var(--pr)">'+bn(p)+'</b></div><div>অনুপস্থিত<b style="color:var(--ab)">'+bn(a)+'</b></div></div>';
 if(!list.length)return h+'<div class="empty">এই শ্রেণীতে কোনো ছাত্র-ছাত্রী নেই। "ছাত্র-ছাত্রী" ট্যাব থেকে যোগ করুন।</div>';
 list.forEach(function(s){
  var x=r[s.id];
  h+='<div class="st '+(x?x.s:"")+'"><div class="info"><b>'+esc(s.name)+'</b><small>আইডি: '+esc(s.sid)+' • '+esc(s.mobile)+'</small></div>'+
  '<button class="btn sm" style="background:'+(x&&x.s==="P"?"var(--pr)":"var(--bd)")+';color:'+(x&&x.s==="P"?"#fff":"var(--tx)")+'" onclick="mark(\''+s.id+'\',\'P\')">উপস্থিত</button>'+
  '<button class="btn sm" style="background:'+(x&&x.s==="A"?"var(--ab)":"var(--bd)")+';color:'+(x&&x.s==="A"?"#fff":"var(--tx)")+'" onclick="mark(\''+s.id+'\',\'A\')">অনুপস্থিত</button>'+
  (x?'<div style="flex:1 1 100%;display:flex;gap:8px;align-items:center"><span class="note">উপস্থিতি সময়:</span><input type="time" style="width:auto" value="'+x.t+'" onchange="setT(\''+s.id+'\',this.value)">'+
  (x.s==="A"?'<a class="btn wa sm" target="_blank" rel="noopener" href="'+waLink(s,selDate)+'">হোয়াটসঅ্যাপে জানান</a>':"")+'</div>':"")+'</div>'});
 return h}
function viewStu(){
 var e=DB.students.filter(function(s){return s.id===editId})[0]||{name:"",mobile:"",sid:"",cls:selCls};
 var h='<div class="card"><b>'+(editId?"তথ্য সম্পাদনা":"নতুন ছাত্র-ছাত্রী যোগ করুন")+'</b>'+
 '<label>ছাত্র/ছাত্রীর নাম</label><input id="f_name" value="'+esc(e.name)+'">'+
 '<label>অভিভাবকের মোবাইল নাম্বার (হোয়াটসঅ্যাপ)</label><input id="f_mob" inputmode="tel" placeholder="01XXXXXXXXX" value="'+esc(e.mobile)+'">'+
 '<div class="row"><div><label>আইডি নম্বর</label><input id="f_sid" value="'+esc(e.sid)+'"></div><div><label>শ্রেণী</label><select id="f_cls">'+CLASSES.map(function(c){return '<option'+(c===e.cls?" selected":"")+'>'+c+'</option>'}).join("")+'</select></div></div>'+
 '<div style="margin-top:10px;display:flex;gap:8px"><button class="btn" onclick="saveStu()">সংরক্ষণ</button>'+(editId?'<button class="btn gr" onclick="editId=null;render()">বাতিল</button>':"")+'</div></div>';
 h+='<div class="card"><label style="margin-top:0">শ্রেণী অনুযায়ী তালিকা</label>'+clsSel(selCls,"selCls=this.value;render()")+'</div>';
 var list=DB.students.filter(function(s){return s.cls===selCls});
 if(!list.length)h+='<div class="empty">কোনো ছাত্র-ছাত্রী নেই</div>';
 list.forEach(function(s){h+='<div class="st"><div class="info"><b>'+esc(s.name)+'</b><small>আইডি: '+esc(s.sid)+' • '+esc(s.mobile)+'</small></div><button class="btn gr sm" onclick="editId=\''+s.id+'\';render();scrollTo(0,0)">সম্পাদনা</button><button class="btn sm" style="background:var(--ab)" onclick="delStu(\''+s.id+'\')">মুছুন</button></div>'});
 return h}
function saveStu(){
 var n=document.getElementById("f_name").value.trim(),m=document.getElementById("f_mob").value.trim(),i=document.getElementById("f_sid").value.trim(),c=document.getElementById("f_cls").value;
 if(!n||!m||!i){alert("নাম, মোবাইল নাম্বার ও আইডি দিন");return}
 if(en(m).replace(/\D/g,"").length<10){alert("সঠিক মোবাইল নাম্বার দিন");return}
 if(DB.students.some(function(s){return s.sid===i&&s.id!==editId})){alert("এই আইডি আগেই ব্যবহৃত হয়েছে");return}
 if(editId){var s=DB.students.filter(function(x){return x.id===editId})[0];s.name=n;s.mobile=m;s.sid=i;s.cls=c}
 else DB.students.push({id:"s"+Date.now(),name:n,mobile:m,sid:i,cls:c});
 selCls=c;editId=null;save();render()}
function delStu(id){if(!confirm("মুছে ফেলবেন?"))return;DB.students=DB.students.filter(function(s){return s.id!==id});save();render()}
function viewDay(){
 var h='<div class="card"><div class="row"><div><label>শ্রেণী</label>'+clsSel(selCls,"selCls=this.value;render()")+'</div><div><label>তারিখ</label><input type="date" value="'+selDate+'" onchange="selDate=this.value||today();render()"></div></div></div>';
 var list=DB.students.filter(function(s){return s.cls===selCls}),r=rec();
 h+='<div class="card"><b>'+selCls+' – '+dateBn(selDate)+'</b>';
 if(!list.length)return h+'<div class="empty">কোনো তথ্য নেই</div></div>';
 h+='<table style="width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px"><tr style="text-align:left;color:var(--mu)"><th>নাম</th><th>আইডি</th><th>অবস্থা</th><th>সময়</th></tr>';
 list.forEach(function(s){var x=r[s.id];h+='<tr style="border-top:1px solid var(--bd)"><td>'+esc(s.name)+'</td><td>'+esc(s.sid)+'</td><td style="color:'+(x?(x.s==="P"?"var(--pr)":"var(--ab)"):"var(--mu)")+'">'+(x?(x.s==="P"?"উপস্থিত":"অনুপস্থিত"):"নেওয়া হয়নি")+'</td><td>'+(x?t12(x.t):"-")+'</td></tr>'});
 h+='</table><p style="margin-bottom:0"><button class="btn gr sm" onclick="window.print()">প্রিন্ট</button></p></div>';
 return h}
// ===== একবার এখানে নিজের GitHub ইউজারনেম ও রিপোজিটরির নাম বসান =====
var DEF={o:"hazira26",r:"hajira-data",b:"main",p:"data.json"};
var GH={};try{GH=JSON.parse(localStorage.getItem("hajira_gh")||"{}")}catch(e){}
GH=Object.assign({},DEF,GH);
var ghSha=null,ghT=null,repQ="",repY=String(new Date().getFullYear());
function ghOn(){return GH.o&&GH.r&&GH.t}
function ghUrl(){return "https://api.github.com/repos/"+GH.o+"/"+GH.r+"/contents/"+(GH.p||"data.json")}
function ghH(){return {"Authorization":"Bearer "+GH.t,"Accept":"application/vnd.github+json"}}
function ghMsg(m){var e=document.getElementById("gh_st");if(e)e.textContent=m}
function ghGet(){return fetch(ghUrl()+"?ref="+(GH.b||"main")+"&t="+Date.now(),{headers:ghH()})}
async function ghPull(){if(!ghOn())return;try{var r=await ghGet();if(r.status===404){ghSha=null;ghMsg("GitHub-এ ফাইল নেই; সংরক্ষণে তৈরি হবে");return}if(!r.ok)throw 0;var j=await r.json();ghSha=j.sha;DB=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))));try{localStorage.setItem("hajira_v1",JSON.stringify(DB))}catch(e){}ghMsg("GitHub থেকে লোড হয়েছে ✓");render()}catch(e){ghMsg("GitHub থেকে লোড ব্যর্থ — টোকেন/রিপোজিটরি যাচাই করুন")}}
async function ghPush(retry){if(!ghOn())return;try{var b={message:"হাজিরা আপডেট "+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(JSON.stringify(DB)))),branch:GH.b||"main"};if(ghSha)b.sha=ghSha;var r=await fetch(ghUrl(),{method:"PUT",headers:ghH(),body:JSON.stringify(b)});if((r.status===409||r.status===422)&&!retry){var g2=await ghGet();if(g2.ok){ghSha=(await g2.json()).sha;return ghPush(true)}}if(!r.ok)throw 0;ghSha=(await r.json()).content.sha;ghMsg("GitHub-এ সংরক্ষিত ✓ "+t12(nowT()))}catch(e){ghMsg("GitHub-এ সংরক্ষণ ব্যর্থ")}}
function save(){try{localStorage.setItem("hajira_v1",JSON.stringify(DB))}catch(e){}if(ghOn()){clearTimeout(ghT);ghT=setTimeout(function(){ghPush()},1500)}}
function gv(i){return document.getElementById(i).value.trim()}
function ghSaveCfg(){GH={o:gv("g_o"),r:gv("g_r"),b:gv("g_b")||"main",p:gv("g_p")||"data.json",t:gv("g_t")};try{localStorage.setItem("hajira_gh",JSON.stringify(GH))}catch(e){}ghPull().then(function(){if(ghSha===null)ghPush()})}
function viewSet(){return '<div class="card"><b>GitHub সংযোগ (স্থায়ী সংরক্ষণ)</b><label>GitHub ইউজারনেম</label><input id="g_o" value="'+esc(GH.o||"")+'"><label>রিপোজিটরির নাম</label><input id="g_r" value="'+esc(GH.r||"")+'"><div class="row"><div><label>ব্রাঞ্চ</label><input id="g_b" value="'+esc(GH.b||"main")+'"></div><div><label>ডেটা ফাইল</label><input id="g_p" value="'+esc(GH.p||"data.json")+'"></div></div><label>Personal Access Token (Contents: Read and write)</label><input id="g_t" type="password" value="'+esc(GH.t||"")+'"><p class="note">টোকেন শুধু এই ডিভাইসের ব্রাউজারে থাকে। ছাত্র-ছাত্রীর তথ্য থাকায় রিপোজিটরি অবশ্যই Private রাখুন।</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="ghSaveCfg()">সংযুক্ত করুন</button><button class="btn gr" onclick="ghPull()">GitHub থেকে লোড</button><button class="btn gr" onclick="ghPush()">এখনই সংরক্ষণ</button></div></div>'}
function yrHtml(){var q=repQ.trim().toLowerCase(),list=DB.students.filter(function(s){return !q||s.name.toLowerCase().indexOf(q)>-1||s.sid.toLowerCase().indexOf(q)>-1||en(s.mobile).indexOf(en(q))>-1});
 if(!list.length)return '<div class="empty">কাউকে পাওয়া যায়নি</div>';
 return list.map(function(s){var p=0,a=0,ad=[];Object.keys(DB.att).sort().forEach(function(k){if(k.indexOf(repY)!==0)return;var x=DB.att[k][s.id];if(!x)return;if(x.s==="P")p++;else{a++;ad.push(dateBn(k.split("|")[0]))}});
 return '<div class="card"><b>'+esc(s.name)+'</b><div class="note">আইডি: '+esc(s.sid)+' • '+esc(s.cls)+' • '+esc(s.mobile)+'</div><div class="sum" style="margin:8px 0 0"><div>উপস্থিত<b style="color:var(--pr)">'+bn(p)+'</b></div><div>অনুপস্থিত<b style="color:var(--ab)">'+bn(a)+'</b></div><div>মোট দিন<b>'+bn(p+a)+'</b></div></div>'+(a?'<div class="note" style="margin-top:6px">অনুপস্থিতির তারিখ: '+ad.join(", ")+'</div>':"")+'</div>'}).join("")}
function viewRep(){var y=new Date().getFullYear(),o="";for(var i=y+1;i>=y-5;i--)o+='<option value="'+i+'"'+(String(i)===repY?" selected":"")+'>'+bn(i)+'</option>';
 return '<div class="card"><b>বার্ষিক রিপোর্ট (নাম/আইডি/মোবাইল দিয়ে খুঁজুন)</b><div class="row"><div><label>খুঁজুন</label><input value="'+esc(repQ)+'" placeholder="নাম লিখুন" oninput="repQ=this.value;document.getElementById(\'yr\').innerHTML=yrHtml()"></div><div><label>সাল</label><select onchange="repY=this.value;document.getElementById(\'yr\').innerHTML=yrHtml()">'+o+'</select></div></div></div><div id="yr">'+yrHtml()+'</div><h3 style="margin:16px 0 8px">দৈনিক রিপোর্ট</h3>'+viewDay()}
function render(){nav();document.getElementById("app").innerHTML=tab==="att"?viewAtt():tab==="stu"?viewStu():tab==="rep"?viewRep():viewSet()}
render();ghPull();
</script>
</body>
</html>
