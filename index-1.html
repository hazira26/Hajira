<script>
var CLASSES=["প্লে","নার্সারি","প্রথম শ্রেণী","দ্বিতীয় শ্রেণী","তৃতীয় শ্রেণি"];

var DB={students:[],att:{}};
try{var s=localStorage.getItem("hajira_v1");if(s)DB=JSON.parse(s)}catch(e){}
var tab="att",selCls=CLASSES[0],selDate=today(),editId=null,selYr=String(new Date().getFullYear());
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function bn(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})}
function en(s){return String(s).replace(/[০-৯]/g,function(d){return "০১২৩৪৫৬৭৮৯".indexOf(d)})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nowT(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function t12(t){if(!t)return"";var p=t.split(":"),h=+p[0],a=h>=12?"অপরাহ্ন":"পূর্বাহ্ন";h=h%12||12;return bn(h)+":"+bn(p[1])+" "+a}
function dateBn(d){var p=d.split("-");return bn(p[2]+"/"+p[1]+"/"+p[0])}
function waNum(m){var n=en(m).replace(/\D/g,"");if(n.indexOf("880")===0)return n;if(n.charAt(0)==="0")return "88"+n;return "880"+n}
function waLink(st,date){
 var msg="আসসালামু আলাইকুম। আপনার সন্তান "+st.name+" (আইডি: "+st.sid+", "+st.cls+") আজ "+dateBn(date)+" তারিখে মাদ্রাসায় অনুপস্থিত ছিল। অনুগ্রহ করে কারণ জানাবেন।\n— "+MADRASA+", "+PHONE;
 return "https://wa.me/"+waNum(st.mobile)+"?text="+encodeURIComponent(msg)}
function rec(){return(DB.att[selDate+"|"+selCls]=DB.att[selDate+"|"+selCls]||{})}
function mark(id,v){var r=rec();if(r[id]&&r[id].s===v){delete r[id]}else{r[id]={s:v,t:nowT()}}save();render()}
function setT(id,v){rec()[id].t=v;save()}
function nav(){
 var t=[["att","হাজিরা"],["stu","ছাত্র-ছাত্রী"],["rep","রিপোর্ট"]];
 document.getElementById("nav").innerHTML=t.map(function(x){return '<button class="'+(tab===x[0]?"on":"")+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join("")}
function clsSel(v,fn){return '<select onchange="'+fn+'">'+CLASSES.map(function(c){return '<option'+(c===v?" selected":"")+'>'+c+'</option>'}).join("")+'</select>'}
function viewAtt(){
 var list=DB.students.filter(function(s){return s.cls===selCls&&(s.yr||CY)===selYr}),r=rec();
 var p=0,a=0;list.forEach(function(s){if(r[s.id]){r[s.id].s==="P"?p++:a++}});
 var h='<div class="card"><div class="row"><div><label>শ্রেণী</label>'+clsSel(selCls,"selCls=this.value;render()")+'</div><div><label>শিক্ষাবর্ষ</label>'+yrSel(selYr,"selYr=this.value;render()")+'</div><div><label>তারিখ</label><input type="date" value="'+selDate+'" onchange="selDate=this.value||today();render()"></div></div></div>';
 h+='<div class="sum"><div>মোট<b>'+bn(list.length)+'</b></div><div>উপস্থিত<b style="color:var(--pr)">'+bn(p)+'</b></div><div>অনুপস্থিত<b style="color:var(--ab)">'+bn(a)+'</b></div></div>';
 if(!list.length)return h+'<div class="empty">এই শ্রেণীতে কোনো ছাত্র-ছাত্রী নেই। "ছাত্র-ছাত্রী" ট্যাব থেকে যোগ করুন।</div>';
 list.forEach(function(s){
  var x=r[s.id];
  h+='<div class="st '+(x?x.s:"")+'"><div class="info"><b>'+esc(s.name)+'</b><small>আইডি: '+esc(s.sid)+' • '+esc(s.mobile)+'</small></div>'+
  '<button class="btn sm" style="background:'+(x&&x.s==="P"?"var(--pr)":"var(--bd)")+';color:'+(x&&x.s==="P"?"#fff":"var(--tx)")+'" onclick="mark(\''+s.id+'\',\'P\')">উপস্থিত</button>'+
  '<button class="btn sm" style="background:'+(x&&x.s==="A"?"var(--ab)":"var(--bd)")+';color:'+(x&&x.s==="A"?"#fff":"var(--tx)")+'" onclick="mark(\''+s.id+'\',\'A\')">অনুপস্থিত</button>'+
  (x?'<div style="flex:1 1 100%;display:flex;gap:8px;align-items:center"><span class="note">উপস্থিতি সময়:</span><input type="time" style="width:auto" value="'+x.t+'" onchange="setT(\''+s.id+'\',this.value)">'+
  (x.s==="A"?'<a class="btn wa sm" target="_blank" rel="noopener" href="'+waLink(s,selDate)+'">হোয়াটসঅ্যাপে জানান</a>':"")+'</div>':"")+'</div>'});
 return h}
function viewStu(){
 var e=DB.students.filter(function(s){return s.id===editId})[0]||{name:"",mobile:"",sid:"",cls:selCls,yr:selYr};
 var h='<div class="card"><b>'+(editId?"তথ্য সম্পাদনা":"নতুন ছাত্র-ছাত্রী যোগ করুন")+'</b>'+
 '<label>ছাত্র/ছাত্রীর নাম</label><input id="f_name" value="'+esc(e.name)+'">'+
 '<label>অভিভাবকের মোবাইল নাম্বার (হোয়াটসঅ্যাপ)</label><input id="f_mob" inputmode="tel" placeholder="01XXXXXXXXX" value="'+esc(e.mobile)+'">'+
 '<div class="row"><div><label>আইডি নম্বর</label><input id="f_sid" value="'+esc(e.sid)+'"></div><div><label>শ্রেণী</label><select id="f_cls">'+CLASSES.map(function(c){return '<option'+(c===e.cls?" selected":"")+'>'+c+'</option>'}).join("")+'</select></div></div>'+
 '<label>শিক্ষাবর্ষ</label><select id="f_yr">'+yrOpts(e.yr||selYr)+'</select><div style="margin-top:10px;display:flex;gap:8px"><button class="btn" onclick="saveStu()">সংরক্ষণ</button>'+(editId?'<button class="btn gr" onclick="editId=null;render()">বাতিল</button>':"")+'</div></div>';
 h+='<div class="card"><div class="row"><div><label style="margin-top:0">শ্রেণী অনুযায়ী তালিকা</label>'+clsSel(selCls,"selCls=this.value;render()")+'</div><div><label style="margin-top:0">শিক্ষাবর্ষ</label>'+yrSel(selYr,"selYr=this.value;render()")+'</div></div>'+promoHtml()+'</div>';
 var list=DB.students.filter(function(s){return s.cls===selCls&&(s.yr||CY)===selYr});
 if(!list.length)h+='<div class="empty">কোনো ছাত্র-ছাত্রী নেই</div>';
 list.forEach(function(s){h+='<div class="st"><div class="info"><b>'+esc(s.name)+'</b><small>আইডি: '+esc(s.sid)+' • '+esc(s.mobile)+'</small></div><button class="btn gr sm" onclick="editId=\''+s.id+'\';render();scrollTo(0,0)">সম্পাদনা</button><button class="btn sm" style="background:var(--ab)" onclick="delStu(\''+s.id+'\')">মুছুন</button></div>'});
 return h}
function saveStu(){
 var n=document.getElementById("f_name").value.trim(),m=document.getElementById("f_mob").value.trim(),i=document.getElementById("f_sid").value.trim(),c=document.getElementById("f_cls").value,y=document.getElementById("f_yr").value;
 if(!n||!m||!i){alert("নাম, মোবাইল নাম্বার ও আইডি দিন");return}
 if(en(m).replace(/\D/g,"").length<10){alert("সঠিক মোবাইল নাম্বার দিন");return}
 if(DB.students.some(function(s){return s.sid===i&&s.id!==editId&&(s.yr||CY)===y})){alert("এই শিক্ষাবর্ষে এই আইডি আগেই ব্যবহৃত হয়েছে");return}
 if(editId){var s=DB.students.filter(function(x){return x.id===editId})[0];s.name=n;s.mobile=m;s.sid=i;s.cls=c;s.yr=y}
 else DB.students.push({id:"s"+Date.now(),name:n,mobile:m,sid:i,cls:c,yr:y});

function delStu(id){if(!confirm("মুছে ফেলবেন?"))return;DB.students=DB.students.filter(function(s){return s.id!==id});save();render()}
function viewDay(){
 var h='<div class="card"><div class="row"><div><label>শ্রেণী</label>'+clsSel(selCls,"selCls=this.value;render()")+'</div><div><label>শিক্ষাবর্ষ</label>'+yrSel(selYr,"selYr=this.value;render()")+'</div><div><label>তারিখ</label><input type="date" value="'+selDate+'" onchange="selDate=this.value||today();render()"></div></div></div>';
 var list=DB.students.filter(function(s){return s.cls===selCls&&(s.yr||CY)===selYr}),r=rec();
 h+='<div class="card"><b>'+selCls+' – '+dateBn(selDate)+'</b>';
 if(!list.length)return h+'<div class="empty">কোনো তথ্য নেই</div></div>';
 h+='<table style="width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px"><tr style="text-align:left;color:var(--mu)"><th>নাম</th><th>আইডি</th><th>অবস্থা</th><th>সময়</th></tr>';
 list.forEach(function(s){var x=r[s.id];h+='<tr style="border-top:1px solid var(--bd)"><td>'+esc(s.name)+'</td><td>'+esc(s.sid)+'</td><td style="color:'+(x?(x.s==="P"?"var(--pr)":"var(--ab)"):"var(--mu)")+'">'+(x?(x.s==="P"?"উপস্থিত":"অনুপস্থিত"):"নেওয়া হয়নি")+'</td><td>'+(x?t12(x.t):"-")+'</td></tr>'});
 h+='</table><p style="margin-bottom:0"><button class="btn gr sm" onclick="window.print()">প্রিন্ট</button></p></div>';
 return h}
// ===== একবার এখানে নিজের GitHub ইউজারনেম ও রিপোজিটরির নাম বসান =====
var DEF={o:"hazira26",r:"hajira-data",b:"main",p:"data.json"};
var GH={};try{GH=JSON.parse(localStorage.getItem("hajira_gh")||"{}")}catch(e){}
GH=Object.assign({},DEF,GH);
try{var hm=location.hash.match(/t=([^&]+)/);if(hm){GH.t=decodeURIComponent(hm[1]);localStorage.setItem("hajira_gh",JSON.stringify(GH));history.replaceState(null,"",location.pathname)}}catch(e){}
var ghSha=null,ghT=null,repQ="",repF=new Date().getFullYear()+"-01-01",repT=today();
function ghOn(){return GH.o&&GH.r&&GH.t}
function ghUrl(){return "https://api.github.com/repos/"+GH.o+"/"+GH.r+"/contents/"+(GH.p||"data.json")}
function ghH(){return {"Authorization":"Bearer "+GH.t,"Accept":"application/vnd.github+json"}}
function ghMsg(m){var e=document.getElementById("gh_st");if(e)e.textContent=m}
