<h1>হিফজুল কুরআন রশিদিয়া হোসাইনিয়া নূরানী মাদ্রাসা</h1>

<script>
var CLASSES=["প্লে","নার্সারি","প্রথম শ্রেণী","দ্বিতীয় শ্রেণী","তৃতীয় শ্রেণি"];
var PROMO=CLASSES.slice(),HIFZ="হিফজুল কুরআন বিভাগ";CLASSES.push(HIFZ);
var MADRASA="হিফজুল কুরআন রশিদিয়া হোসাইনিয়া নূরানী মাদ্রাসা";
var PHONE="০১৭১১৩৪০২০৫";
var DB={students:[],att:{}};
try{var s=localStorage.getItem("hajira_v1");if(s)DB=JSON.parse(s)}catch(e){}
var tab="sum",selCls=CLASSES[0],selDate=today(),editId=null,selYr=String(new Date().getFullYear());
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function bn(n){return String(n).replace(/\d/g,function(d){return "০১২৩৪৫৬৭৮৯"[d]})}
function en(s){return String(s).replace(/[০-৯]/g,function(d){return "০১২৩৪৫৬৭৮৯".indexOf(d)})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nowT(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function t12(t){if(!t)return"";var p=t.split(":"),h=+p[0],a=h>=12?"অপরাহ্ন":"পূর্বাহ্ন";h=h%12||12;return bn(h)+":"+bn(p[1])+" "+a}
function dateBn(d){var p=d.split("-");return bn(p[2]+"/"+p[1]+"/"+p[0])}
function waNum(m){var n=en(m).replace(/\D/g,"");if(n.indexOf("880")===0)return n;if(n.charAt(0)==="0")return "88"+n;return "880"+n}
function absMsg(st,date){
 var msg="আসসালামু আলাইকুম। আপনার সন্তান "+st.name+" (আইডি: "+st.sid+", "+st.cls+") আজ "+dateBn(date)+" তারিখে মাদ্রাসায় অনুপস্থিত ছিল। অনুগ্রহ করে কারণ জানাবেন।\n— "+MADRASA+", "+PHONE;
 return msg}
function waLink(st,date){return "https://wa.me/"+waNum(st.mobile)+"?text="+encodeURIComponent(absMsg(st,date))}
function rec(){return(DB.att[selDate+"|"+selCls]=DB.att[selDate+"|"+selCls]||{})}
var ST={P:["উপস্থিত","var(--pr)"],A:["অনুপস্থিত","var(--ab)"],S:["অসুস্থ","#d98c00"],L:["ছুটি","#2f7bd6"]};
var DL={A:"অনুপস্থিতির তারিখ",S:"অসুস্থতার তারিখ",L:"ছুটির তারিখ"};
function byRoll(a,b){var x=parseInt(en(a.roll||""),10),y=parseInt(en(b.roll||""),10);if(isNaN(x))x=1e9;if(isNaN(y))y=1e9;return x-y||a.name.localeCompare(b.name,"bn")}
function stCells(cn){return ["P","A","S","L"].map(function(k){return '<div>'+ST[k][0]+'<b style="color:'+ST[k][1]+'">'+bn(cn[k]||0)+'</b></div>'}).join("")}
function stBtn(id,k,x){var on=x&&x.s===k;return '<button class="btn sm" style="flex:1;padding:6px 2px;background:'+(on?ST[k][1]:"var(--bd)")+';color:'+(on?"#fff":"var(--tx)")+'" onclick="mark(\''+id+'\',\''+k+'\')">'+ST[k][0]+'</button>'}
function mark(id,v){var r=rec();if(r[id]&&r[id].s===v){delete r[id]}else{r[id]={s:v,t:nowT()}}save();render()}
function setT(id,v){rec()[id].t=v;save()}
function nav(){
 var t=[["sum","সারসংক্ষেপ"],["att","হাজিরা"],["stu","ছাত্র-ছাত্রী"],["rep","রিপোর্ট"]];
 document.getElementById("nav").innerHTML=t.map(function(x){return '<button class="'+(tab===x[0]?"on":"")+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join("")}
function clsSel(v,fn){return '<select onchange="'+fn+'">'+CLASSES.map(function(c){return '<option'+(c===v?" selected":"")+'>'+c+'</option>'}).join("")+'</select>'}
function viewAtt(){
 var list=DB.students.filter(function(s){return s.cls===selCls&&(s.yr||CY)===selYr}).sort(byRoll),r=rec();
 var cn={P:0,A:0,S:0,L:0};list.forEach(function(s){if(r[s.id])cn[r[s.id].s]++});
 var h='<div class="card"><div class="row"><div><label>শ্রেণী</label>'+clsSel(selCls,"selCls=this.value;render()")+'</div><div><label>শিক্ষাবর্ষ</label>'+yrSel(selYr,"selYr=this.value;render()")+'</div><div><label>তারিখ</label><input type="date" value="'+selDate+'" onchange="selDate=this.value||today();render()"></div></div></div>';
 h+='<div class="sum"><div>মোট<b>'+bn(list.length)+'</b></div>'+stCells(cn)+'</div>';
 if(!list.length)return h+'<div class="empty">এই শ্রেণীতে কোনো ছাত্র-ছাত্রী নেই। "ছাত্র-ছাত্রী" ট্যাব থেকে যোগ করুন।</div>';
 list.forEach(function(s){
  var x=r[s.id];
  h+='<div class="st '+(x?x.s:"")+'"><div class="info"><b>'+esc(s.name)+'</b><small>'+(s.roll?'রোল: '+esc(s.roll)+' • ':'')+'আইডি: '+esc(s.sid)+' • '+esc(s.mobile)+'</small></div>'+
  '<div style="flex:1 1 100%;display:flex;gap:6px">'+["P","A","S","L"].map(function(k){return stBtn(s.id,k,x)}).join("")+'</div>'+
  (x&&(x.s==="P"||x.s==="A")?'<div style="flex:1 1 100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="note">উপস্থিতি সময়:</span><input type="time" style="width:auto" value="'+x.t+'" onchange="setT(\''+s.id+'\',this.value)">'+
  (x.s==="A"?'<a class="btn wa sm" target="_blank" rel="noopener" href="'+waLink(s,selDate)+'">হোয়াটসঅ্যাপে জানান</a><button class="btn sm" style="background:#0e8ae6" onclick="imoSend(\''+s.id+'\')">ইমোতে জানান</button>':"")+'</div>':"")+'</div>'});
 return h}
function viewStu(){
 var e=DB.students.filter(function(s){return s.id===editId})[0]||{name:"",mobile:"",sid:"",cls:selCls,yr:selYr};
 var h='<div class="card"><b>'+(editId?"তথ্য সম্পাদনা":"নতুন ছাত্র-ছাত্রী যোগ করুন")+'</b>'+
 '<label>ছাত্র/ছাত্রীর নাম</label><input id="f_name" value="'+esc(e.name)+'">'+
 '<label>অভিভাবকের মোবাইল নাম্বার (হোয়াটসঅ্যাপ)</label><input id="f_mob" inputmode="tel" placeholder="01XXXXXXXXX" value="'+esc(e.mobile)+'">'+
 '<div class="row"><div><label>আইডি নম্বর</label><input id="f_sid" value="'+esc(e.sid)+'"></div><div><label>ক্লাস রোল</label><input id="f_roll" inputmode="numeric" value="'+esc(e.roll||"")+'"></div></div><div class="row"><div style="display:none"></div><div><label>শ্রেণী</label><select id="f_cls">'+CLASSES.map(function(c){return '<option'+(c===e.cls?" selected":"")+'>'+c+'</option>'}).join("")+'</select></div></div>'+
 '<label>শিক্ষাবর্ষ</label><select id="f_yr">'+yrOpts(e.yr||selYr)+'</select><div style="margin-top:10px;display:flex;gap:8px"><button class="btn" onclick="saveStu()">সংরক্ষণ</button>'+(editId?'<button class="btn gr" onclick="editId=null;render()">বাতিল</button>':"")+'</div></div>';
 h+='<div class="card"><div class="row"><div><label style="margin-top:0">শ্রেণী অনুযায়ী তালিকা</label>'+clsSel(selCls,"selCls=this.value;render()")+'</div><div><label style="margin-top:0">শিক্ষাবর্ষ</label>'+yrSel(selYr,"selYr=this.value;render()")+'</div></div>'+promoHtml()+'</div>';
 var list=DB.students.filter(function(s){return s.cls===selCls&&(s.yr||CY)===selYr}).sort(byRoll);
 if(!list.length)h+='<div class="empty">কোনো ছাত্র-ছাত্রী নেই</div>';
 list.forEach(function(s){h+='<div class="st"><div class="info"><b>'+esc(s.name)+'</b><small>'+(s.roll?'রোল: '+esc(s.roll)+' • ':'')+'আইডি: '+esc(s.sid)+' • '+esc(s.mobile)+'</small></div><button class="btn gr sm" onclick="editId=\''+s.id+'\';render();scrollTo(0,0)">সম্পাদনা</button><button class="btn sm" style="background:var(--ab)" onclick="delStu(\''+s.id+'\')">মুছুন</button></div>'});
 return h}
function saveStu(){
 var n=document.getElementById("f_name").value.trim(),m=document.getElementById("f_mob").value.trim(),i=document.getElementById("f_sid").value.trim(),c=document.getElementById("f_cls").value,y=document.getElementById("f_yr").value,ro=document.getElementById("f_roll").value.trim();
 if(!n||!m||!i){alert("নাম, মোবাইল নাম্বার ও আইডি দিন");return}
 if(en(m).replace(/\D/g,"").length<10){alert("সঠিক মোবাইল নাম্বার দিন");return}
 if(DB.students.some(function(s){return s.sid===i&&s.id!==editId&&(s.yr||CY)===y})){alert("এই শিক্ষাবর্ষে এই আইডি আগেই ব্যবহৃত হয়েছে");return}
 if(ro&&DB.students.some(function(x){return x.id!==editId&&x.cls===c&&(x.yr||CY)===y&&en(x.roll||"")===en(ro)})){alert("এই শ্রেণী ও শিক্ষাবর্ষে এই রোল আগেই ব্যবহৃত হয়েছে");return}
 if(editId){var s=DB.students.filter(function(x){return x.id===editId})[0];s.name=n;s.mobile=m;s.sid=i;s.cls=c;s.yr=y;s.roll=ro}
 else DB.students.push({id:"s"+Date.now(),name:n,mobile:m,sid:i,cls:c,yr:y,roll:ro});
 selCls=c;selYr=y;editId=null;save();render()}
function delStu(id){if(!confirm("মুছে ফেলবেন?"))return;DB.students=DB.students.filter(function(s){return s.id!==id});save();render()}
function viewDay(){
 var h='<div class="card"><div class="row"><div><label>শ্রেণী</label>'+clsSel(selCls,"selCls=this.value;render()")+'</div><div><label>শিক্ষাবর্ষ</label>'+yrSel(selYr,"selYr=this.value;render()")+'</div><div><label>তারিখ</label><input type="date" value="'+selDate+'" onchange="selDate=this.value||today();render()"></div></div></div>';
 var list=DB.students.filter(function(s){return s.cls===selCls&&(s.yr||CY)===selYr}).sort(byRoll),r=rec();
